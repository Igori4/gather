services:
  # ─── Local PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gather_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gather
      POSTGRES_PASSWORD: gather_dev_password
      POSTGRES_DB: gather_dev
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gather -d gather_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Email catcher (web UI at http://localhost:8025) ─────────────────────────
  # Catches all emails sent to any address — no real email is ever delivered.
  # View captured emails at http://localhost:8025 after starting the stack.
  # Note: only intercepts emails when RESEND_API_KEY is unset or invalid.
  #       For dev, the API logs the reset URL to stdout regardless (see email.ts).
  mailpit:
    image: axllent/mailpit:latest
    container_name: gather_mailpit
    restart: unless-stopped
    ports:
      - '8025:8025' # web UI
      - '1025:1025' # SMTP (unused by Resend, but available for nodemailer)

  # ─── API (Express) ───────────────────────────────────────────────────────────
  api:
    build:
      context: . # monorepo root — gives Dockerfile access to all packages
      dockerfile: apps/api/Dockerfile.dev
    container_name: gather_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      # Override DATABASE_URL from .env — points to the local postgres container
      DATABASE_URL: postgresql://gather:gather_dev_password@postgres:5432/gather_dev
      FRONTEND_URL: http://localhost:5173
    env_file:
      - .env # provides JWT secrets, RESEND_API_KEY, etc.
    ports:
      - '4000:4000'
    volumes:
      - ./apps/api:/workspace/apps/api # hot-reload source
      - ./packages/shared:/workspace/packages/shared # hot-reload shared schemas
      - workspace_modules:/workspace/node_modules # preserve container's node_modules
    # Run migrations first, then start the dev server WITHOUT dotenv-cli
    # (Docker already injects env vars — using dotenv would re-load .env and
    #  overwrite the DATABASE_URL above with the Supabase pooler URL)
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"

  # ─── Web (React / Vite) ──────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: gather_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_SOCKET_URL: http://localhost:4000
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    env_file:
      - .env
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web:/workspace/apps/web
      - ./packages/shared:/workspace/packages/shared
      - workspace_modules:/workspace/node_modules
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  postgres_data:
  workspace_modules:
