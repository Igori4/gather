version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gather_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gather
      POSTGRES_PASSWORD: gather_dev_password
      POSTGRES_DB: gather_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gather -d gather_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: gather_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://gather:gather_dev_password@postgres:5432/gather_dev
    env_file:
      - .env
    ports:
      - '4000:4000'
    volumes:
      - ./apps/api:/app
      - ./packages/shared:/packages/shared
      - /app/node_modules
    command: npm run dev

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: gather_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_SOCKET_URL: http://localhost:4000
    env_file:
      - .env
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web:/app
      - ./packages/shared:/packages/shared
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
